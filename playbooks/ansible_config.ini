[workstation]
127.0.0.1 ansible_connection=local

[workstation:vars]
# Oracle RAC — SCAN/VIP Address (Cohesity UI label; required for RAC)
scan_vip_address=10.14.40.126
rac_endpoint=10.14.40.122


[linux]
192.168.1.1
192.168.1.2

[oraclelinux]
192.168.1.3

[oraclelinux:vars]
ansible_user=root
ansible_password=PASSWORD

[all:vars]
# Cohesity cluster (required)
cohesity_server=192.168.1.23
cohesity_username=admin
cohesity_password=PASSWORD
cohesity_validate_certs=False
ansible_python_interpreter=/usr/bin/python3

# Protection job (edit for your environment)
oracle_job_name=protect_oracle
oracle_job_policy=Bronze
oracle_storage_domain=DefaultStorageDomain

# Recovery (edit for your environment; database must have a backup)
oracle_source_db=db1
oracle_target_db=db1
oracle_task_name=recover_tasks_rac_1
oracle_home=/u01/app/oracle/product/12.1.0.2/db_1
oracle_base=/u01/app/oracle
oracle_data=/u01/app/oracle/product/12.1.0.2/db_1

[linux:vars]
ansible_user=root
ansible_password=PASSWORD

[windows]
192.168.2.1 ansible_winrm_port=5985 ansible_winrm_server_cert_validation=ignore ansible_connection=winrm ansible_user=Administrator ansible_password=PASSWORD

[sql]
192.168.2.2
