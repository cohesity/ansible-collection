# Playbook to refresh Oracle source available in the cluster.
#
# Standalone (default):
#   ansible-playbook refresh_oracle_source.yml -i ../ansible_config.ini
#
# RAC:
#   ansible-playbook refresh_oracle_source.yml -i ../ansible_config.ini \
#     -e "oracle_source_type=rac"
---
- name: Playbook to refresh Oracle source available in the cluster
  hosts: localhost
  become: false

  vars:
    oracle_source_type: standalone

  tasks:
    - name: "Cohesity Protection Source: Refresh Source"
      cohesity.dataprotect.cohesity_oracle_source:
        cluster: "{{ cohesity_server }}"
        username: "{{ cohesity_username }}"
        password: "{{ cohesity_password }}"
        validate_certs: "{{ cohesity_validate_certs }}"
        state: present
        refresh: true
        source_type: "{{ oracle_source_type }}"
        endpoint: "{{ rac_endpoint | default('') if oracle_source_type == 'rac' else oracle_endpoint }}"
        scan_vip_address: "{{ scan_vip_address | default('') }}"
