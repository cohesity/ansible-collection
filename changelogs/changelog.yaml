ancestor: 1.3.0
releases:
  1.4.2:
    changes:
      bugfixes:
      - Fixed LiteralPath Issue During Cohesity Window Agent Installation
      - Fixed collection failure issues for some ansible version
      major_changes:
      - Ansible-Core Minimum Version Bumped to 2.16
    release_date: '2025-01-30'
  1.4.3:
    changes:
      bugfixes:
      - cohesity_agent - Fixed agent detection failing with "Cohesity Agent is partially
        installed" on systemd hosts where the SysV init script is not created by the
        installer.
    release_date: '2026-04-22'
  1.4.4:
    changes:
      bugfixes:
      - ansible-lint - Removed ``name[template]`` from ``.ansible-lint`` skip_list
        and fixed task names across playbooks to ensure Jinja2 template variables
        appear only at the end of task name strings.
      - galaxy.yml - Added ``ansible.cfg`` and ``.ansible`` to ``build_ignore`` to
        prevent local developer configuration files from being packaged into the collection
        tarball.
      minor_changes:
      - Added Changelog section to README with recent version highlights.
      - Added Support (Red Hat Users) section to README with Ansible Automation Hub
        guidance.
      - removed ansible-core from requirements.txt
      security_fixes:
      - Bumped ``requests`` minimum version to ``>=2.31.0`` to address known security
        vulnerabilities in older versions.
    release_date: '2026-05-21'
  1.4.5:
    changes:
      bugfixes:
      - 'cohesity_agent - Added ``Content-Type: application/json`` header to agent
        update REST calls.'
      - 'cohesity_auth - Added ``Content-Type: application/json`` header to access
        token requests to prevent HTTP 415 errors when urllib defaults to ``application/x-www-form-urlencoded``.'
      - 'cohesity_cancel_migration - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_finalize_migration - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_job - Added missing ``Content-Type: application/json`` header on
        JSON POST requests.'
      - 'cohesity_migrate_vm - Added missing ``Content-Type: application/json`` header
        on JSON POST requests.'
      - 'cohesity_oracle_restore - Added ``Content-Type: application/json`` header
        to recovery task REST calls.'
      - cohesity_oracle_source - Fixed ``register_oracle_source()`` return value handling
        and RAC source registration status lookup.
      - 'cohesity_plugin - Added missing ``Content-Type: application/json`` header
        on JSON POST requests.'
      - 'cohesity_restore_file - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_restore_vm - Added missing ``Content-Type: application/json`` header
        on JSON POST requests.'
      - 'cohesity_restore_vmware_file - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_source - Added missing ``Content-Type: application/json`` header
        on JSON POST requests.'
      - 'cohesity_sync_objects - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_uda_protection_group - Added missing ``Content-Type: application/json``
        header on JSON POST requests.'
      - 'cohesity_uda_source - Added missing ``Content-Type: application/json`` header
        on JSON POST requests.'
      minor_changes:
      - Added Oracle module unit tests (``cohesity_oracle_source``, ``cohesity_oracle_job``,
        ``cohesity_oracle_restore``) and E2E test coverage with ``tests/run_all_tests.sh``
        for standalone and RAC execution.
      - Oracle workflow playbooks updated for Standalone and RAC modes (``register_oracle_source``,
        ``refresh_oracle_source``, ``create_oracle_job``, ``recover_db``). Settings are read from
        ``ansible_config.ini``; use ``-e "oracle_source_type=rac"`` for RAC and ``-e`` to overwrite
        config values.
      - cohesity_oracle_job - Added ``source_type`` parameter (``standalone``/``rac``)
        for Oracle RAC protection job creation with SCAN/VIP endpoint resolution.
      - cohesity_oracle_restore - Added ``source_type`` parameter (``standalone``/``rac``)
        and RAC source alias fallback when searching backups for database recovery.
      - cohesity_oracle_source - Added Oracle RAC cluster registration via
        ``source_type`` (``standalone``/``rac``) and ``scan_vip_address`` (SCAN/VIP Address;
        alias ``rac_agent_node``), UI-equivalent ``/backupsources`` physical registration,
        and RAC source lookup by SCAN name and reachable endpoint.
    fragments: []
    release_date: '2026-06-03'
